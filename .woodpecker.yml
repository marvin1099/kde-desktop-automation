steps:
  checks:
    image: python:3.12-slim-bookworm
    commands:
      - python -m pip install --no-cache-dir uv==0.13.7
      - uv sync --locked --all-groups
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy src
      - uv run pytest -q
      - uv build --out-dir dist
      - sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
    when:
      - event: [push, pull_request, tag]

  validate-release-tag:
    image: python:3.12-slim-bookworm
    commands:
      - python scripts/check_release_tag.py "$CI_COMMIT_TAG"
    when:
      - event: tag
        ref: refs/tags/v*

  publish-codeberg-draft:
    image: woodpeckerci/plugin-release:1.0.0
    settings:
      api_key:
        from_secret: CODEBERG_RELEASE_TOKEN
      base_url: https://codeberg.org
      title: "${CI_COMMIT_TAG}"
      note: "Automated draft. Review the checks and assets, add release notes, then publish."
      draft: true
      files:
        - dist/*.whl
        - dist/*.tar.gz
        - dist/SHA256SUMS
    when:
      - event: tag
        ref: refs/tags/v*
