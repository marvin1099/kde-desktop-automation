[project]
name = "kde-interaction"
version = "0.1.0"
description = "An AI-friendly KDE interaction CLI with private and explicit live-desktop targets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbus-next>=0.2.3,<0.3.0",
    "mcp>=1.20.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "rich>=14.0.0,<15.0.0",
    "typer>=0.16.0,<1.0.0",
]

[project.scripts]
kde-ai = "kde_interaction.cli:main"
kde-ai-mcp = "kde_interaction.mcp_server:main"

[dependency-groups]
dev = [
    "mypy>=1.16.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-cov>=6.2.0,<7.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "integration: starts a private KWin compositor or inspects the live user desktop",
]

[tool.coverage.run]
branch = true
source = ["kde_interaction"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
pretty = true
