[project]
name = "kde-desktop-automation"
version = "0.1.0"
description = "A CLI and Python toolkit for automating KDE Plasma, with MCP support for AI agents"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "dbus-next>=0.2.3,<0.3.0",
    "mcp>=1.20.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "rich>=14.0.0,<15.0.0",
    "typer>=0.16.0,<1.0.0",
]

[project.scripts]
kde-desktop = "kde_desktop_automation.cli:main"
kde-desktop-mcp = "kde_desktop_automation.mcp_server:main"

[project.urls]
Homepage = "https://codeberg.org/marvin1099/kde-desktop-automation"
Repository = "https://codeberg.org/marvin1099/kde-desktop-automation"
Mirror = "https://github.com/marvin1099/kde-desktop-automation"
Issues = "https://codeberg.org/marvin1099/kde-desktop-automation/issues"

[dependency-groups]
dev = [
    "mypy>=1.16.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-cov>=6.2.0,<7.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "integration: starts a private KWin compositor or inspects the live user desktop",
]

[tool.coverage.run]
branch = true
source = ["kde_desktop_automation"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
pretty = true
